# Workday tenants.
#
# HOW TO ADD A COMPANY:
#   1. Open their public careers site in a browser.
#   2. Look for a URL of the form:
#        https://{tenant}.wd{POD}.myworkdayjobs.com/{site}/
#      or open DevTools → Network → search for "myworkdayjobs.com" while
#      loading their listings page.
#   3. Extract tenant, pod (the number after "wd"), and site slug.
#   4. Add an entry below.
#
# NOTE: many companies people expect on Workday are NOT there:
#   - Uber, Amazon, Apple, Netflix, Microsoft, TSMC → custom portals
#   - Intuit, Cisco → Workday backend but proxied behind their own domain,
#     the raw Workday URL isn't publicly guessable; you'd need to inspect
#     network traffic on their careers page to find it.
#
# Optional per-entry: query (default ""), max_pages (default 20).

workday:
  # ---- verified working (probed 2026-09-01) ----
  - {name: salesforce, tenant: salesforce, pod: 12, site: External_Career_Site}
  - {name: nvidia,     tenant: nvidia,     pod: 5,  site: NVIDIAExternalCareerSite}
  - {name: micron,     tenant: micron,     pod: 1,  site: External}
  - {name: trendmicro, tenant: trendmicro, pod: 3,  site: External}
  - {name: caci,       tenant: caci,       pod: 1,  site: External}    # 1753 postings
  - {name: regeneron,  tenant: regeneron,  pod: 1,  site: Careers}     # 580 postings
